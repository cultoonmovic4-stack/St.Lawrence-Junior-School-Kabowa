[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mysqli",
    "php82Extensions.gd",
    "php82Extensions.zip",
    "php82Extensions.mbstring",
    "php82Extensions.curl"
]

[phases.install]
cmds = [
    "mkdir -p backend/uploads/admissions backend/uploads/gallery backend/uploads/library backend/uploads/profiles backend/uploads/teachers backend/uploads/videos backend/cache",
    "chmod -R 777 backend/uploads backend/cache"
]

[start]
cmd = "php -d upload_max_filesize=100M -d post_max_size=200M -d memory_limit=512M -d max_file_uploads=250 -d max_execution_time=300 -S 0.0.0.0:$PORT"
