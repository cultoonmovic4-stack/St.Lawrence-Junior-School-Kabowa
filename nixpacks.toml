[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mysqli",
    "php82Extensions.gd",
    "php82Extensions.zip",
    "php82Extensions.mbstring",
    "php82Extensions.curl"
]

[start]
cmd = "php -d upload_max_filesize=50M -d post_max_size=100M -d memory_limit=512M -d max_file_uploads=250 -d max_execution_time=300 -S 0.0.0.0:$PORT"
