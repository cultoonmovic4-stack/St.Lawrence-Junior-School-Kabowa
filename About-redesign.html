<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/about">
    <title>Redirecting...</title>
    <script>
        (function() {
            var host = window.location.hostname;
            var isLocal = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');
            if (!isLocal) {
                window.location.replace('/about' + window.location.search + window.location.hash);
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="/about">/about</a>...</p>
</body>
</html>
